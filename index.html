<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm Feed</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f7d6d">
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e7e3da;--accent:#2f7d6d;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#15181a;--card:#1e2224;--text:#e8e6e1;--muted:#9aa0a6;--line:#2c3235;--accent:#5fb8a5;--accent-t:#0e1513}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1e2224;--text:#e8e6e1;--muted:#9aa0a6;--line:#2c3235;--accent:#5fb8a5;--accent-t:#0e1513}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}main.wide{max-width:1800px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:14px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.hide{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{flex:1;min-width:150px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font:inherit;cursor:pointer}
button.ghost,.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
button.ghost.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button:disabled{opacity:.6}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--accent-t);text-decoration:none}
#msg,#amsg,#pmsg{font-size:14px;min-height:20px;margin:6px 0;color:var(--muted)}.err{color:#d14343!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bar button{padding:7px 11px;font-size:14px}.who,.today{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.authbox{max-width:380px;margin:40px auto}.authbox input{width:100%;margin-bottom:8px}
.lnk{background:none;color:var(--accent);padding:4px 0;border:0;text-decoration:underline;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;cursor:pointer}.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.ch{position:relative;text-align:center;padding:16px 8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}.ch.editing{cursor:default}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;margin:0 auto 8px;font-size:30px;color:var(--muted)}
.ch .n{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.dot{position:absolute;top:8px;left:8px;background:#f03;color:#fff;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px}
.pb{position:absolute;top:8px;right:8px;font-size:13px;color:var(--muted)}
.ed{display:flex;justify-content:center;gap:4px;margin-top:8px}.ed button{padding:3px 7px;font-size:13px;background:none;border:1px solid var(--line);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;border:0;display:block;object-fit:cover}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff;text-shadow:0 2px 12px #0008}
.seen{position:absolute;left:8px;top:8px;background:#000b;color:#fff;font-size:12px;padding:2px 9px;border-radius:99px}
.dur{position:absolute;right:6px;bottom:9px;background:#000c;color:#fff;font-size:12px;line-height:1.3;padding:0 5px;border-radius:4px}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff66}.pbar i{display:block;height:100%;background:#f03}
.info{padding:10px 12px}.t{font-weight:600;margin:0 0 4px;font-size:15px}.m{font-size:13px;color:var(--muted)}
.card[data-w]{cursor:pointer}
.vm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 10px}.vm input{max-width:280px}.vm .row{gap:6px}.vm button{padding:7px 12px;font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}.list .card{display:flex}.list .thumb{flex:0 0 240px}.list .info{padding:10px 16px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:520px){.list .thumb{flex-basis:140px}}
.plist{display:flex;flex-direction:column;gap:10px}
a.post{display:flex;gap:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.post img{width:120px;height:80px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line)}.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.hd{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.hd .av{margin:0;width:56px;height:56px;font-size:20px}.hd h1{margin:0}
.pcard{cursor:pointer}.badge{position:absolute;right:0;top:0;bottom:0;width:34%;background:#000b;color:#fff;display:grid;place-items:center;font-size:13px;text-align:center}
.end{text-align:center;color:var(--muted);padding:20px 0}
.watch{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:16px;margin-top:12px}
@media(max-width:860px){.watch{grid-template-columns:1fr}}
.watch.noup{grid-template-columns:minmax(0,1fr)}.watch.noup .wr{display:none}
.watch.noup>div:first-child{width:min(88%,calc((100vh - 170px) * 16 / 9));width:min(88%,calc((100dvh - 170px) * 16 / 9));min-width:min(100%,420px);margin:0 auto}
.pwrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;background:#10201c}
.wt{font-size:18px;margin:12px 0 4px}
.uph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.uph .sub{margin:0}.uph button,#upopen{padding:5px 10px;font-size:13px}
#upopen{display:none;margin-top:6px}.watch.noup #upopen{display:inline-block}
.uplist{position:relative;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.up{display:flex;gap:10px;padding:6px;border-radius:10px;cursor:pointer;border:1px solid transparent}.up:hover{background:var(--card)}.up.cur{background:var(--card);border-color:var(--accent)}
.up .ut{position:relative;flex:0 0 96px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}.up img{width:100%;height:100%;object-fit:cover;display:block}
.up .t{font-size:12px;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.up .m{font-size:11px}
.up .dur{font-size:10px;right:3px;bottom:7px;padding:0 3px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.field label{font-size:14px}.field.inline{flex-direction:row;align-items:center;gap:10px}.field.inline input{flex:0 0 auto;min-width:0}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sbar{height:14px;background:var(--accent);border-radius:7px;min-width:2px}.srow{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
#adside{position:fixed;right:10px;top:90px;width:160px;display:none}@media(min-width:1500px){#adside{display:block}}
</style>
</head>
<body>
<main>
  <div id="pub" class="hide"></div>

  <div id="auth" class="hide">
    <div class="authbox">
      <h1>Calm Feed</h1>
      <p class="sub">Your favorites in one calm place. Your channels and history are saved to your account.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <div class="row"><button id="signin">Sign in</button><button id="signup" class="ghost">Create account</button></div>
      <button class="lnk" id="forgot">Forgot password?</button>
      <div id="amsg"></div>
    </div>
  </div>

  <div id="recov" class="hide">
    <div class="authbox">
      <h1>Set a new password</h1>
      <input id="np" type="password" placeholder="New password (6+ characters)" autocomplete="new-password">
      <button id="savepw">Save password</button>
      <div id="rmsg" class="sub"></div>
    </div>
  </div>

  <div id="app" class="hide">
    <div class="top">
      <h1 id="brand" data-nav="home" style="cursor:pointer">Calm Feed</h1>
      <div class="bar"><span class="who" id="who"></span><span class="today" id="today"></span>
        <button class="ghost" data-nav="summary">Summary</button><button class="ghost" data-nav="history">History</button>
        <button class="ghost" data-nav="settings">Settings</button><button class="ghost" data-nav="out">Sign out</button></div>
    </div>
    <p class="sub">Only what you chose. No recommendations, no endless scroll.</p>
    <div id="view"></div>
  </div>
</main>
<div id="adside" class="hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL = "https://atavoxosxqvicazhexus.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0YXZveG9zeHF2aWNhemhleHVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDI1ODEsImV4cCI6MjEwNjY3ODU4MX0.9nS-2zYEJ_L8h1mHsvNWbpf-qIoJSxVYaHQquBmhMUU";
var FREE_LIMIT = 15;          // channels allowed on the free plan
var ADSENSE_CLIENT = "";      // e.g. "ca-pub-1234567890123456" (leave empty = no ads)
var ADSENSE_SLOT = "";        // your ad unit id
var $ = function (id) { return document.getElementById(id); };
var API = /^https?:$/.test(location.protocol) ? "" : "http://localhost:3000";
var NOSERVER = "Can't reach the server. Is it running?";
var PI = { youtube: "▶", reddit: "r/", bluesky: "🦋", rss: "📰", instagram: "📷", x: "𝕏" };
var sb = null, USER = null, PROFILE = { plan: "free" }, favs = [], WROWS = [], WSET = {}, PROG = {}, NEWC = {};
var CURNAME = "", CURCH = "", EDIT = false, FOLDER = "", HQ = "", VS = "", RECOV = false;
var S = { hideShorts: false, hideLive: false, limit: 0, qFrom: "", qTo: "", theme: "auto" };
var MODE = "grid", UPHIDE = false, USAGE = {}, BONUS = {};
try { Object.assign(S, JSON.parse(localStorage.getItem("calm_settings") || "{}")); } catch (e) {}
try { MODE = localStorage.getItem("calm_mode") || "grid"; UPHIDE = localStorage.getItem("calm_uphide") === "1"; } catch (e) {}
try { USAGE = JSON.parse(localStorage.getItem("calm_usage") || "{}"); BONUS = JSON.parse(localStorage.getItem("calm_bonus") || "{}"); } catch (e) {}
try { sb = supabase.createClient(SB_URL, SB_KEY); } catch (e) {}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function ago(d) { if (!d) return ""; var h = Math.floor((Date.now() - new Date(d)) / 36e5); if (h < 1) return "just now"; if (h < 24) return h + "h ago"; var n = Math.floor(h / 24); return n < 30 ? n + "d ago" : Math.floor(n / 30) + "mo ago"; }
function msg(t, err) { var m = $("msg"); if (m) { m.textContent = t || ""; m.className = err ? "err" : ""; } }
function amsg(t, err) { $("amsg").textContent = t || ""; $("amsg").className = err ? "err" : ""; }
function pmsg(t, err) { var m = $("pmsg"); if (m) { m.textContent = t || ""; m.className = err ? "err" : ""; } }
function isYT(id) { return /^UC[\w-]{22}$/.test(id); }
function pf(id) { return isYT(id) ? "youtube" : ({ rd: "reddit", bs: "bluesky", rss: "rss", ig: "instagram", tw: "x" })[id.split(":")[0]] || "youtube"; }
function byId(id) { for (var i = 0; i < favs.length; i++) if (favs[i].id === id) return favs[i]; }
function avatar(f) { return f.avatar ? '<img class="av" src="' + esc(f.avatar) + '" alt="">' : '<div class="av">' + esc(isYT(f.id) ? (f.name || "?").charAt(0) : PI[pf(f.id)]) + '</div>'; }
function fail(e) { return esc(e instanceof TypeError ? NOSERVER : e.message); }
function dkey(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function today() { return dkey(new Date()); }
function applyTheme() { var r = document.documentElement; if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme); }
function saveSettings() { try { localStorage.setItem("calm_settings", JSON.stringify(S)); } catch (e) {} }
function saveUsage() { try { localStorage.setItem("calm_usage", JSON.stringify(USAGE)); localStorage.setItem("calm_bonus", JSON.stringify(BONUS)); } catch (e) {} }

async function api(path) {
  var h = {};
  if (sb) { var s = (await sb.auth.getSession()).data.session; if (s) h.Authorization = "Bearer " + s.access_token; }
  var r = await fetch(API + path, { headers: h }), t = await r.text(), d;
  try { d = JSON.parse(t); } catch (e) { throw new Error("The server is out of date. Update server.js on GitHub and wait for Render to redeploy."); }
  if (d.error) throw new Error(d.error);
  return d;
}

/* ---------- saving ---------- */
function dbErr(r) { if (r && r.error) msg("Couldn't save: " + r.error.message, true); return r; }
function rowOf(f, full) {
  var r = { user_id: USER.id, channel_id: f.id, name: f.name, avatar: f.avatar || "", playlists: f.playlists || [] };
  if (full) { r.last_seen = f.last_seen || null; r.folder = f.folder || ""; r.position = f.position || 0; }
  return r;
}
function saveFav(f) {
  return sb.from("channels").upsert(rowOf(f, true), { onConflict: "user_id,channel_id" }).then(function (r) {
    if (r.error && /column/i.test(r.error.message)) return sb.from("channels").upsert(rowOf(f, false), { onConflict: "user_id,channel_id" }).then(dbErr);
    return dbErr(r);
  });
}
function delFav(id) { return sb.from("channels").delete().eq("channel_id", id).then(dbErr); }
function markWatched(id, title, channel) {
  WSET[id] = 1; WROWS.unshift({ video_id: id, title: title, channel: channel, watched_at: new Date().toISOString() });
  sb.from("watched").insert({ user_id: USER.id, video_id: id, title: title, channel: channel }).then(dbErr);
}

/* ---------- ads (only if you set ADSENSE_CLIENT) ---------- */
function showAd(on) {
  var a = $("adside");
  if (!ADSENSE_CLIENT || PROFILE.plan === "pro" || !on) { a.classList.add("hide"); return; }
  if (!a.getAttribute("data-ready")) {
    a.innerHTML = '<ins class="adsbygoogle" style="display:block" data-ad-client="' + ADSENSE_CLIENT + '" data-ad-slot="' + ADSENSE_SLOT + '" data-ad-format="auto"></ins>';
    var s = document.createElement("script"); s.async = true; s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + ADSENSE_CLIENT; document.head.appendChild(s);
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    a.setAttribute("data-ready", "1");
  }
  a.classList.remove("hide");
}

/* ---------- time limit and quiet hours ---------- */
function toMin(t) { var p = (t || "0:0").split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
function usedSec() { return USAGE[today()] || 0; }
function limitSec() { return S.limit > 0 ? (S.limit + (BONUS[today()] || 0)) * 60 : 0; }
function quiet() {
  if (!S.qFrom || !S.qTo || S.qFrom === S.qTo) return false;
  var n = new Date(), m = n.getHours() * 60 + n.getMinutes(), a = toMin(S.qFrom), b = toMin(S.qTo);
  return a < b ? (m >= a && m < b) : (m >= a || m < b);
}
function blockReason() {
  if (quiet()) return "Quiet hours (" + S.qFrom + " to " + S.qTo + "). Time to rest your eyes.";
  if (limitSec() && usedSec() >= limitSec()) return "You've reached today's limit of " + S.limit + " minutes.";
  return "";
}
function paintToday() { var t = $("today"); if (t) t.textContent = "Today: " + Math.floor(usedSec() / 60) + (S.limit > 0 ? " / " + S.limit : "") + " min"; }

/* ---------- video lists: grid / list, filters, search ---------- */
function cls() { return MODE === "list" ? "list" : "grid"; }
function vdur(v) { return v.dur || (PROG[v.id] && PROG[v.id].d) || 0; }
function vis(list) {
  var q = VS.toLowerCase();
  return list.filter(function (v) {
    if (S.hideShorts && vdur(v) > 0 && vdur(v) <= 60) return false;
    if (S.hideLive && v.live) return false;
    if (q && String(v.title).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function fmtDur(s) { s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x; }
function dur(v) { var s = vdur(v); return s > 0 ? '<div class="dur">' + fmtDur(s) + '</div>' : ""; }
function pct(id) { var p = PROG[id]; if (!p || !(p.d > 0) || !(p.s > 0)) return 0; var x = p.s / p.d * 100; return x > 95 ? 100 : Math.max(2, Math.round(x)); }
function pbar(id) { var x = pct(id); return x ? '<div class="pbar"><i style="width:' + x + '%"></i></div>' : ""; }
function gridItems(videos) {
  return videos.map(function (v) {
    return '<div class="card" data-w="' + v.id + '"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg" alt=""><div class="play">▶</div>' + (WSET[v.id] ? '<div class="seen">✓ Watched</div>' : '') + dur(v) + pbar(v.id) + '</div>' +
      '<div class="info"><p class="t">' + esc(v.title) + '</p><div class="m">' + (v.published ? ago(v.published) : "") + '</div></div></div>';
  }).join("");
}
function viewBar() {
  return '<div class="vm"><input id="vs" placeholder="Filter videos by title…" value="' + esc(VS) + '"><div class="row"><button class="ghost' + (MODE === "grid" ? " on" : "") + '" data-mode="grid">▦ Grid</button><button class="ghost' + (MODE === "list" ? " on" : "") + '" data-mode="list">☰ List</button></div></div>';
}
var LSRC = [], LN = 30, LNEXT = "";
function listShell(src, next) { LSRC = src; LN = 30; LNEXT = next || ""; return viewBar() + '<div class="' + cls() + '" id="vgrid"></div><div class="end" id="vmore"></div>'; }
function drawList() {
  var g = $("vgrid"); if (!g) return;
  var f = vis(LSRC); QUEUE = f;
  g.innerHTML = gridItems(f.slice(0, LN));
  var html = "";
  if (f.length > LN) html = '<button class="ghost" data-more="1">Show more</button>';
  else if (LNEXT) html = '<button class="ghost" data-load="1">Load more videos</button>';
  else if (!f.length) html = LSRC.length ? "No videos match your filters." : "No videos found.";
  $("vmore").innerHTML = html;
}

/* ---------- home ---------- */
function tile(f) {
  var n = NEWC[f.id], p = pf(f.id);
  var ed = EDIT ? '<div class="ed"><button data-mv="' + f.id + '|-1">◀</button><button data-mv="' + f.id + '|1">▶</button><button data-folder="' + f.id + '">📁</button><button data-rm="' + f.id + '">✕</button></div>' : "";
  return '<div class="ch' + (EDIT ? " editing" : "") + '"' + (EDIT ? "" : ' data-ch="' + f.id + '"') + '>' + (n ? '<span class="dot">' + (n >= 15 ? "15+" : n) + '</span>' : "") +
    (p !== "youtube" ? '<span class="pb">' + PI[p] + '</span>' : "") + avatar(f) + '<div class="n">' + esc(f.name) + '</div>' + ed + '</div>';
}
function drawHome() {
  var c = $("chs"); if (!c) return;
  if (!favs.length) { c.innerHTML = '<div class="end">Add a channel above to get started.</div>'; return; }
  var folders = [], seen = {};
  favs.forEach(function (f) { if (f.folder && !seen[f.folder]) { seen[f.folder] = 1; folders.push(f.folder); } });
  folders.sort();
  if (FOLDER && !seen[FOLDER]) FOLDER = "";
  $("fchips").innerHTML = folders.length ? '<div class="chips"><span class="chip' + (FOLDER ? "" : " on") + '" data-fold="">All</span>' + folders.map(function (x) { return '<span class="chip' + (FOLDER === x ? " on" : "") + '" data-fold="' + esc(x) + '">' + esc(x) + '</span>'; }).join("") + '</div>' : "";
  var q = HQ.toLowerCase();
  var list = favs.filter(function (f) { return (!FOLDER || f.folder === FOLDER) && (!q || f.name.toLowerCase().indexOf(q) >= 0); });

  var c = await sb.from("channels").select("*").order("position").order("created_at");
  var rows = c.data || [];
  favs = rows.map(function (r) { return { id: r.channel_id, name: r.name, avatar: r.avatar, playlists: r.playlists || [], last_seen: r.last_seen || null, folder: r.folder || "", position: r.position || 0 }; });
  var w = await sb.from("watched").select("video_id,title,channel,watched_at").order("watched_at", { ascending: false }).limit(300);
  WROWS = w.data || []; WSET = {}; WROWS.forEach(function (r) { WSET[r.video_id] = 1; });
  PROG = {}; try { PROG = JSON.parse(localStorage.getItem("calm_prog") || "{}"); } catch (e) {}
  var pr = await sb.from("progress").select("video_id,seconds,duration");
  if (!pr.error) (pr.data || []).forEach(function (r) { PROG[r.video_id] = { s: r.seconds, d: r.duration }; });
  var pp = await sb.from("profiles").select("*").eq("user_id", USER.id).maybeSingle();
  PROFILE = (pp && pp.data) ? pp.data : { plan: "free" };
}
async function boot() {
  applyTheme();
  if (!sb) { $("auth").classList.remove("hide"); amsg("Couldn't load the sign-in service. Check your internet and refresh.", true); return; }
  var s = (await sb.auth.getSession()).data.session; USER = s ? s.user : null;
  var u = new URLSearchParams(location.search).get("u");
  if (u) return showPublic(u.toLowerCase());
  if (RECOV) { $("app").classList.add("hide"); $("auth").classList.add("hide"); $("recov").classList.remove("hide"); return; }
  if (!s) { $("pub").classList.add("hide"); $("app").classList.add("hide"); $("auth").classList.remove("hide"); return; }
  $("who").textContent = USER.email; $("auth").classList.add("hide"); $("app").classList.remove("hide");
  $("view").innerHTML = '<div class="end">Loading your channels…</div>';
  try { await loadData(); } catch (e) { msg("Couldn't load your data: " + e.message, true); }
  home();
}
async function authGo(kind) {
  var email = $("email").value.trim(), pass = $("pass").value;
  if (!email || !pass) return amsg("Enter your email and password.", true);
  amsg(kind === "in" ? "Signing in…" : "Creating account…");
  var r = kind === "in" ? await sb.auth.signInWithPassword({ email: email, password: pass }) : await sb.auth.signUp({ email: email, password: pass });
  if (r.error) return amsg(r.error.message, true);
  if (!r.data.session) return amsg("Account created. Check your email to confirm it, then sign in.");
  amsg(""); boot();
}
async function forgot() {
  var email = $("email").value.trim(); if (!email) return amsg("Type your email above first, then tap Forgot password.", true);
  var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/" });
  if (r.error) amsg(r.error.message, true); else amsg("If that email has an account, a reset link is on its way.");
}
async function saveNewPass() {
  var p = $("np").value; if (p.length < 6) { $("rmsg").textContent = "Use at least 6 characters."; return; }
  var r = await sb.auth.updateUser({ password: p });
  if (r.error) { $("rmsg").textContent = r.error.message; return; }
  RECOV = false; $("recov").classList.add("hide"); boot();
}
if (sb) sb.auth.onAuthStateChange(function (ev) {
  if (ev === "PASSWORD_RECOVERY") { RECOV = true; ["app", "auth", "pub"].forEach(function (x) { $(x).classList.add("hide"); }); $("recov").classList.remove("hide"); }
});

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target, el, id;
  if (t.id === "add") return addChannel();
  if (t.id === "signin") return authGo("in");
  if (t.id === "signup") return authGo("up");
  if (t.id === "forgot") return forgot();
  if (t.id === "savepw") return saveNewPass();
  if ((el = t.closest("[data-nav]"))) {
    var n = el.getAttribute("data-nav");
    if (n === "out") { sb.auth.signOut().then(function () { favs = []; WROWS = []; WSET = {}; NEWC = {}; PROFILE = { plan: "free" }; leave(); boot(); }); return; }
    ({ home: home, summary: summary, history: history, settings: settings })[n](); return;
  }
  if ((el = t.closest("[data-rm]"))) { id = el.getAttribute("data-rm"); var f = byId(id); if (f && confirm("Remove " + f.name + "?")) { favs.splice(favs.indexOf(f), 1); delFav(id); drawHome(); } return; }
  if ((el = t.closest("[data-mv]"))) { var a = el.getAttribute("data-mv").split("|"); moveFav(a[0], +a[1]); return; }
  if ((el = t.closest("[data-folder]"))) { setFolder(el.getAttribute("data-folder")); return; }
  if ((el = t.closest("[data-edit]"))) { EDIT = !EDIT; home(); return; }
  if (t.closest(".chip[data-fold]")) { FOLDER = t.closest(".chip").getAttribute("data-fold"); drawHome(); return; }
  if ((el = t.closest("[data-saveprof]"))) { saveProfile(); return; }
  if ((el = t.closest("[data-addpub]"))) { addPublic(+el.getAttribute("data-addpub")); return; }
  if ((el = t.closest("[data-up]"))) {
    UPHIDE = el.getAttribute("data-up") === "hide"; try { localStorage.setItem("calm_uphide", UPHIDE ? "1" : "0"); } catch (x) {}
    var wc = document.querySelector(".watch"); if (wc) wc.classList.toggle("noup", UPHIDE);
    if (!UPHIDE) paintQ(); return;
  }
  if ((el = t.closest("[data-mode]"))) {
    MODE = el.getAttribute("data-mode"); try { localStorage.setItem("calm_mode", MODE); } catch (x) {}
    var g = $("vgrid"); if (g) g.className = cls();
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-mode") === MODE); }); return;
  }
  if ((el = t.closest("[data-more]"))) { LN += 30; drawList(); return; }
  if ((el = t.closest("[data-load]"))) {
    el.disabled = true;
    api("/api/latest?id=" + encodeURIComponent(CURCH) + "&page=" + encodeURIComponent(LNEXT)).then(function (d) { LSRC = LSRC.concat(d.videos); LNEXT = d.next || ""; LN += 30; drawList(); }).catch(function () { el.disabled = false; });
    return;
  }
  if ((el = t.closest("[data-bonus]"))) { BONUS[today()] = (BONUS[today()] || 0) + (+el.getAttribute("data-bonus") || 10); saveUsage(); watch(QUEUE[CUR].id); return; }
  if ((el = t.closest("[data-tab]"))) { channel(el.getAttribute("data-id"), el.getAttribute("data-tab")); return; }
  if ((el = t.closest("[data-pl]"))) { openPlaylist(el.getAttribute("data-cid"), el.getAttribute("data-pl")); return; }
  if ((el = t.closest("[data-q]"))) { playIdx(+el.getAttribute("data-q")); return; }
  if ((el = t.closest("[data-w]"))) { watch(el.getAttribute("data-w")); return; }
  if ((el = t.closest("[data-ret]"))) { if (RET) RET(); else home(); return; }
  if ((el = t.closest("[data-ch]"))) { channel(el.getAttribute("data-ch"), el.getAttribute("data-back") || "latest"); return; }
  if ((el = t.closest("[data-home]"))) { home(); }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "hq") { HQ = e.target.value; drawHome(); }
  if (e.target.id === "vs") { VS = e.target.value; LN = 30; drawList(); }
});
document.addEventListener("change", function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute("data-set"); if (!k) return;
  S[k] = t.type === "checkbox" ? t.checked : t.type === "number" ? Math.max(0, +t.value || 0) : t.value;
  saveSettings(); if (k === "theme") applyTheme(); paintToday();
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  if (e.target.id === "q") addChannel(); else if (e.target.id === "pass" || e.target.id === "email") authGo("in"); else if (e.target.id === "np") saveNewPass();
});
boot();
</script>
</body>
</html>
